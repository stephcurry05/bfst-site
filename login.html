<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - Institut</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <img src="BFST.jpg" alt="BFST">
    <h1>Bêafrica Fondation pour les Sciences et la Technologie</h1>
  </div>
</header>

<main>
  <div class="center-box">
    <h2>Connexion</h2>
    <form action="accueil.html" method="get">
      <label for="username">Nom d'utilisateur</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required>

      <input type="submit" value="Se connecter">
    </form>
  </div>
</main>

<footer>
  &copy; 2026 - Bêafrica Fondation pour les Sciences et la Technologie
</footer>

</body>
</html>
